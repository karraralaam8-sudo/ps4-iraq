<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 Iraq</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#fff;font-family:Arial,sans-serif}
header{padding:28px 6%;background:linear-gradient(135deg,#101a36,#080b13);position:sticky;top:0;z-index:5;border-bottom:1px solid #202b45}
.logo{font-size:28px;font-weight:900;color:#4da3ff}.logo span{color:#fff}
header p{color:#9aa8c0;margin:7px 0 20px}.search{display:flex;gap:10px}
.search input{flex:1;padding:15px;border:1px solid #33405b;border-radius:12px;background:#0d1423;color:#fff;font-size:16px}
.search button{padding:0 22px;border:0;border-radius:12px;background:#147df5;color:#fff;font-weight:bold}
.hero{padding:45px 6%;background:radial-gradient(circle at 20% 30%,#153b6d,transparent 45%)}
h1{font-size:42px;margin:0 0 10px}.hero p{color:#b6c2d6;max-width:650px;line-height:1.8}
.filters{padding:20px 6%;display:flex;gap:10px;flex-wrap:wrap}
.filters button{background:#111a2b;color:#dbe7f8;border:1px solid #2b3852;padding:10px 18px;border-radius:20px;cursor:pointer}
.filters button.active{background:#147df5;border-color:#147df5}
.grid{padding:10px 6% 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:20px}
.card{background:#0d1422;border:1px solid #202c43;border-radius:16px;overflow:hidden;transition:.2s;cursor:pointer}
.card:hover{transform:translateY(-5px);border-color:#338cff}.cover{width:100%;height:270px;object-fit:cover;background:#182235}
.info{padding:14px}.info h3{margin:0 0 8px}.meta{color:#91a1b9;font-size:13px}.rating{color:#ffd35a;margin-top:10px}
.empty{grid-column:1/-1;text-align:center;color:#93a0b5;padding:50px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;padding:20px;overflow:auto}
.box{max-width:850px;margin:30px auto;background:#0d1422;border:1px solid #2a3955;border-radius:18px;overflow:hidden}
.box img{width:100%;max-height:380px;object-fit:cover}.content{padding:24px}
.close{float:left;background:#26344d;border:0;color:white;border-radius:10px;padding:8px 13px;cursor:pointer}
.trailer{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;margin-top:15px}
footer{text-align:center;padding:30px;color:#718099;border-top:1px solid #182238}
@media(max-width:600px){h1{font-size:30px}.cover{height:235px}}
</style>
</head>
<body>
<header>
<div class="logo">PS4 <span>IRAQ</span></div>
<p>دليلك العربي لألعاب PlayStation 4</p>
<div class="search"><input id="search" placeholder="ابحث عن لعبة..."><button onclick="render()">بحث</button></div>
</header>
<section class="hero"><h1>ألعاب PS4</h1><p>اكتشف أشهر ألعاب بلايستيشن 4، التقييمات، القصة والتريلرات في مكان واحد.</p></section>
<div class="filters">
<button class="active" onclick="setFilter('all',this)">الكل</button>
<button onclick="setFilter('action',this)">أكشن</button>
<button onclick="setFilter('adventure',this)">مغامرات</button>
<button onclick="setFilter('sports',this)">رياضة</button>
<button onclick="setFilter('rpg',this)">RPG</button>
</div>
<main id="grid" class="grid"></main>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="box"><img id="mimg"><div class="content"><button class="close" onclick="closeModal()">إغلاق</button>
<h2 id="mtitle"></h2><div id="mmeta" class="meta"></div><div id="mrating" class="rating"></div>
<p id="mdesc" style="line-height:1.9;color:#c4cfdf"></p><iframe id="trailer" class="trailer" allowfullscreen></iframe>
</div></div></div>
<footer>PS4 IRAQ — مشروع ألعاب عربي</footer>
<script>
const games=[
{name:'God of War',cat:'action',year:2018,rating:9.6,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co1tmu.jpg',desc:'رحلة ملحمية لكريتوس وابنه أتريوس في عالم الأساطير الإسكندنافية.',video:'https://www.youtube.com/embed/K0u_kAWLJOA'},
{name:'Spider-Man',cat:'action',year:2018,rating:9,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co1r7x.jpg',desc:'تجول في نيويورك بشخصية سبايدرمان وواجه أعداء المدينة.',video:'https://www.youtube.com/embed/q4GdJVvdxss'},
{name:'The Last of Us Part II',cat:'adventure',year:2020,rating:9.3,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co1s7d.jpg',desc:'قصة درامية عن إيلي وجويل والانتقام والبقاء في عالم ما بعد الكارثة.',video:'https://www.youtube.com/embed/btmN-bWwv0A'},
{name:'Red Dead Redemption 2',cat:'adventure',year:2018,rating:9.8,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co1q1f.jpg',desc:'عش حياة الخارج عن القانون آرثر مورغان في عالم مفتوح ضخم.',video:'https://www.youtube.com/embed/gmA6MrX81z4'},
{name:'FIFA 23',cat:'sports',year:2022,rating:8.5,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co4zwv.jpg',desc:'لعبة كرة القدم الشهيرة مع أطوار متعددة وفرق ولاعبين حول العالم.',video:'https://www.youtube.com/embed/o3V-GvvzjE4'},
{name:'Elden Ring',cat:'rpg',year:2022,rating:9.5,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg',desc:'استكشف أراضي Lands Between وخض معارك صعبة ضد زعماء أسطوريين.',video:'https://www.youtube.com/embed/E3Huy2cdih0'},
{name:'Ghost of Tsushima',cat:'action',year:2020,rating:9.2,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co2b7m.jpg',desc:'محارب ساموراي يدافع عن جزيرة تسوشيما ضد الغزو المغولي.',video:'https://www.youtube.com/embed/MUz1JEgX1KQ'},
{name:'Horizon Zero Dawn',cat:'rpg',year:2017,rating:9.1,img:'https://images.igdb.com/igdb/image/upload/t_cover_big/co1t7i.jpg',desc:'ألوي تستكشف عالماً مستقبلياً تسيطر عليه آلات غامضة.',video:'https://www.youtube.com/embed/wzx96gYA8ek'}
];
let filter='all';
function render(){
let q=document.getElementById('search').value.toLowerCase();
let list=games.filter(g=>(filter==='all'||g.cat===filter)&&g.name.toLowerCase().includes(q));
document.getElementById('grid').innerHTML=list.length?list.map((g,i)=>`<article class="card" onclick="openGame(${games.indexOf(g)})"><img class="cover" src="${g.img}" alt="${g.name}"><div class="info"><h3>${g.name}</h3><div class="meta">${g.year} • PlayStation 4</div><div class="rating">★ ${g.rating}</div></div></article>`).join(''):'<div class="empty">لم يتم العثور على ألعاب مطابقة.</div>';
}
function setFilter(f,b){filter=f;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}
function openGame(i){let g=games[i];mimg.src=g.img;mtitle.textContent=g.name;mmeta.textContent=`${g.year} • PlayStation 4`;mrating.textContent=`★ ${g.rating} / 10`;mdesc.textContent=g.desc;trailer.src=g.video;modal.style.display='block'}
function closeModal(){modal.style.display='none';trailer.src=''}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();
</script>
</body>
</html>
