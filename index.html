<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="description" content="مكتبة PS4 Iraq لأكثر من 12 ألف لعبة PS4 مع البحث والبوسترات والتريلرات وروابط المتجر.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://karraralaam8-sudo.github.io/ps4-iraq/">
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f7fb;font-family:Arial,Tahoma,sans-serif}
.hero{padding:22px 5% 45px;background:radial-gradient(circle at 80% 0,#214b8d,transparent 35%),linear-gradient(135deg,#0b1425,#070b12)}
nav{max-width:1300px;margin:auto;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:900;color:#69a7ff}.badge{border:1px solid #38547a;border-radius:999px;padding:8px 12px;color:#c0cce0}
.heroIn{max-width:1000px;margin:55px auto 0;text-align:center}.hero h1{font-size:clamp(38px,7vw,70px);margin:0 0 10px}.hero p{color:#c1ccdc;line-height:1.9}
.search{display:flex;gap:9px;margin:24px auto;max-width:900px}.search input{flex:1;background:#101827;border:1px solid #344965;color:white;border-radius:14px;padding:17px;font-size:17px}.search button{background:#3985ff;color:#fff;border:0;border-radius:14px;padding:0 25px;font-weight:900}
.wrap{max-width:1450px;margin:auto;padding:30px 5%}.bar{display:flex;justify-content:space-between;align-items:center}.bar h2{font-size:30px}.count{color:#94a5bf}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters select,.filters button{background:#111927;color:#fff;border:1px solid #2d405c;border-radius:10px;padding:11px}
.letters{display:flex;gap:6px;overflow:auto;padding:5px 0 18px}.letters button{background:#111927;color:#b8c6d9;border:1px solid #293b57;border-radius:9px;padding:8px 12px}.letters button.active{background:#3985ff;color:#fff}
.status{text-align:center;color:#91a1b9;padding:18px}.progress{height:6px;background:#182235;border-radius:99px;overflow:hidden;margin:0 auto 20px;max-width:600px}.progress i{display:block;height:100%;width:0;background:#3985ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:17px}.card{background:#101721;border:1px solid #1d2b40;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#3985ff}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#17243a}.info{padding:11px}.title{font-weight:800;line-height:1.45;min-height:43px}.meta{display:flex;justify-content:space-between;color:#899ab2;font-size:12px;margin-top:7px}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:30px}.pager button{background:#111927;color:#fff;border:1px solid #30425e;padding:10px 16px;border-radius:10px}.pager button:disabled{opacity:.35}
.empty{text-align:center;padding:70px;color:#8797ad}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#101721;border:1px solid #30435f;border-radius:22px;padding:22px}.close{float:left;background:#27364c;color:#fff;border:0;border-radius:9px;padding:9px 13px}
.mimg{width:230px;max-height:345px;object-fit:cover;border-radius:14px;float:right;margin-left:22px}.box h2{font-size:30px;margin-top:35px}.box p{line-height:2;color:#c6d0df}.links{clear:both;display:flex;gap:9px;flex-wrap:wrap;padding-top:18px}.links a{color:#fff;text-decoration:none;padding:11px 15px;border-radius:10px;font-weight:bold;background:#e52f50}.links a.alt{background:#294361}.links a.store{background:#2f75df}
footer{border-top:1px solid #151e2d;text-align:center;color:#687891;padding:35px}@media(max-width:600px){.heroIn{margin-top:40px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.mimg{float:none;width:150px}}
</style>
</head>
<body>
<section class="hero"><nav><div class="logo">🎮 PS4 IRAQ</div><div class="badge">12,000+ لعبة • عربي</div></nav>
<div class="heroIn"><h1>مكتبة ألعاب PS4</h1><p>ابحث في آلاف ألعاب PlayStation 4 واستكشف البوستر والتريلر ورابط المتجر. للألعاب المشهورة يوجد شرح عربي.</p>
<div class="search"><input id="q" placeholder="ابحث عن GTA V أو A Way Out أو God of War..." autocomplete="off"><button onclick="applySearch()">بحث</button></div></div></section>
<main class="wrap"><div class="bar"><h2>🎮 الألعاب</h2><span class="count" id="count">جاري التحميل...</span></div>
<div class="filters"><select id="type"><option value="">كل الأنواع</option><option>Full Game</option><option>Game Bundle</option><option>Premium Edition</option></select><button onclick="resetAll()">إعادة ضبط</button></div>
<div class="letters" id="letters"></div><div class="progress"><i id="prog"></i></div><div class="status" id="status">جاري تحميل الكتالوج...</div><div class="grid" id="grid"></div><div class="pager" id="pager"></div></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="close" onclick="closeModal()">إغلاق</button><img id="mimg" class="mimg"><h2 id="mtitle"></h2><p id="mmeta"></p><p id="mdesc"></p><div class="links"><a id="yt" target="_blank">▶ التريلر</a><a id="wiki" class="alt" target="_blank">📖 ويكيبيديا بالعربي</a><a id="store" class="store" target="_blank">🛒 متجر PlayStation</a></div></div></div>
<footer>PS4 Iraq © 2026 — مكتبة ألعاب PlayStation 4</footer>
<script>
const BASE='https://raw.githubusercontent.com/Ephellon/game-store-catalog/main/ps4/';
const L=['!','a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];
let all=[],filtered=[],page=1,current='';
const ar={
'god of war ragnarok':'في God of War Ragnarök يواصل كريتوس وأتريوس رحلتهما في العوالم الإسكندنافية مع اقتراب راجناروك، ويواجهان آلهة ومحاربين وأخطاراً جديدة.',
'god of war':'يعود كريتوس مع ابنه أتريوس في مغامرة مليئة بالأساطير والمعارك، ويحاولان فهم أسرار العالم الإسكندنافي ومواجهة الأخطار التي تهدد عائلتهما.',
'the last of us part ii':'تدور القصة حول إيلي بعد سنوات من الجزء الأول، حيث تقودها رحلة انتقام قاسية في عالم مدمر وتكتشف ثمن قراراتها.',
'the last of us remastered':'بعد انتشار وباء دمّر الحضارة، يرافق جويل إيلي عبر الولايات المتحدة في رحلة خطيرة تتحول إلى علاقة إنسانية عميقة.',
'grand theft auto v':'تدور GTA V في لوس سانتوس، حيث تتقاطع حياة مايكل وفرانكلين وتريفور أثناء تنفيذ عمليات وسرقات كبيرة.',
'red dead redemption 2':'تروي اللعبة قصة آرثر مورغان وعصابة فان دير ليند في أواخر عصر الغرب الأمريكي، وسط مطاردة القانون وصراعات العصابة.',
'a way out':'مغامرة تعاونية لشخصين عن ليو وفينسنت، سجينين يتعاونان للهروب من السجن ثم يواجهان الشرطة ومشكلات الماضي.',
'uncharted 4':'يعود ناثان دريك إلى المغامرة عندما يظهر شقيقه سام، ويبحث الاثنان عن كنز هنري أفري في رحلة مليئة بالألغاز والمطاردات.',
'spider-man':'تلعب دور بيتر باركر وهو يحمي نيويورك من العصابات والأعداء، مع قتال سريع والتنقل بين ناطحات السحاب وقصة شخصية.',
'bloodborne':'يصل الصياد إلى يارنام، مدينة العلاج الغامض، ليجد نفسه أمام وحوش وأسرار كونية مرعبة في عالم مظلم وصعب.',
'horizon zero dawn':'تلعب دور ألوي، صائدة تعيش في عالم تسيطر عليه آلات ضخمة، وتحاول اكتشاف أصلها وأسرار الحضارة القديمة.',
'days gone':'يعيش ديكون سانت جون في عالم اجتاحه وباء حوّل البشر إلى مخلوقات متوحشة، ويبحث عن زوجته سارة وسط عالم خطير.',
'resident evil 2':'يصل ليون وكلير إلى راكون سيتي أثناء تفشي وباء يحول السكان إلى زومبي، ويحاولان النجاة وكشف الحقيقة.',
'resident evil 4':'يُرسل ليون إلى قرية معزولة لإنقاذ ابنة الرئيس الأمريكي، لكنه يكتشف جماعة غامضة ومؤامرة خطيرة.',
'elden ring':'يصل اللاعب إلى الأراضي الوسطى بصفته Tarnished ويخوض رحلة لاستعادة قوة الـElden Ring في عالم مفتوح مليء بالأسرار والزعماء.',
'the witcher 3':'يتقمص اللاعب دور جيرالت، صياد الوحوش، الذي يبحث عن سيري عبر ممالك وحروب وصراعات سياسية ومهام كثيرة.',
'assassins creed origins':'تدور الأحداث في مصر القديمة، حيث يلعب اللاعب دور بايك ويكتشف مؤامرة تقوده إلى تأسيس جماعة الحشاشين.',
'far cry 5':'يصل اللاعب إلى مقاطعة هوب في مونتانا لمواجهة طائفة مسلحة، ويمكنه تحرير المناطق ومساعدة السكان.',
'detroit become human':'تدور الأحداث في مستقبل تستخدم فيه أندرويدات شبيهة بالبشر، وتؤثر اختيارات اللاعب في مصير الشخصيات ونهاية القصة.'
};
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function norm(s){return String(s||'').toLowerCase().replace(/[®™:.,'’!?\-]/g,' ').replace(/\s+/g,' ').trim()}
function ph(t){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900"><rect width="100%" height="100%" fill="#17243a"/><text x="50%" y="45%" fill="white" font-size="30" text-anchor="middle">'+String(t).slice(0,25)+'</text><text x="50%" y="53%" fill="#8196b7" font-size="20" text-anchor="middle">PS4 IRAQ</text></svg>')}
async function getLetter(x){try{let r=await fetch(BASE+encodeURIComponent(x)+'.json');if(!r.ok)return[];let a=await r.json();return a.filter(g=>g?.name&&g.platforms?.includes('PS4'))}catch(e){return[]}}
function drawLetters(){letters.innerHTML='<button class="active" onclick="setLetter(\'\')">الكل</button>'+L.map(x=>'<button onclick="setLetter(\''+x+'\')">'+(x==='!'?'#':x.toUpperCase())+'</button>').join('')}
function setLetter(x){current=x;document.querySelectorAll('.letters button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.letters button')[L.indexOf(x)+1]?.classList.add('active');applySearch()}
async function load(){drawLetters();for(let i=0;i<L.length;i+=4){let rs=await Promise.all(L.slice(i,i+4).map(getLetter));all.push(...rs.flat());prog.style.width=Math.min(100,(i+4)/L.length*100)+'%';status.textContent='جاري تحميل الألعاب '+Math.min(100,Math.round((i+4)/L.length*100))+'%';}
let m=new Map();all.forEach(g=>m.set((g.name+'|'+(g.uuid||'')).toLowerCase(),g));all=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name));status.textContent='اكتمل تحميل الكتالوج.';applySearch()}
function applySearch(){let q=norm(document.getElementById('q').value),t=type.value;filtered=all.filter(g=>{let n=norm(g.name);return(!q||n.includes(q))&&(!t||g.rating===t)&&(!current||(current==='!'?!/^[a-z]/i.test(n):n.startsWith(current)))});page=1;render()}
function render(){count.textContent=(q.value.trim()?filtered.length.toLocaleString()+' نتيجة من ':'')+all.length.toLocaleString()+' لعبة PS4';let s=(page-1)*72,l=filtered.slice(s,s+72);grid.innerHTML=l.length?l.map((g,i)=>'<article class="card" onclick="openGame('+(s+i)+')"><img class="poster" src="'+esc(g.image||ph(g.name))+'" onerror="this.src=\''+ph(g.name)+'\'" loading="lazy"><div class="info"><div class="title">'+esc(g.name)+'</div><div class="meta"><span>'+esc(g.price||'PS4')+'</span><span>'+esc(g.rating||'')+'</span></div></div></article>').join(''):'<div class="empty">لا توجد نتائج. جرّب اسماً آخر.</div>';let n=Math.ceil(filtered.length/72);pager.innerHTML=n>1?'<button '+(page===1?'disabled':'')+' onclick="go('+(page-1)+')">السابق</button><span>صفحة '+page+' من '+n+'</span><button '+(page===n?'disabled':'')+' onclick="go('+(page+1)+')">التالي</button>':''}
function go(n){page=n;render();scrollTo({top:500,behavior:'smooth'})}
function resetAll(){q.value='';type.value='';current='';drawLetters();applySearch()}
function openGame(i){let g=filtered[i];if(!g)return;modal.classList.add('show');mtitle.textContent=g.name;mmeta.textContent='🎮 PS4 • '+(g.rating||'لعبة')+' • '+(g.price||'');let n=norm(g.name),d='لا يوجد شرح عربي مخصص لهذه اللعبة حتى الآن. يمكنك فتح ويكيبيديا بالعربي أو مشاهدة التريلر لمعرفة المزيد.';for(let k in ar)if(n.includes(k)||k.includes(n)){d=ar[k];break}mdesc.textContent=d;mimg.src=g.image||ph(g.name);yt.href='https://www.youtube.com/results?search_query='+encodeURIComponent(g.name+' PS4 trailer');wiki.href='https://ar.wikipedia.org/w/index.php?search='+encodeURIComponent(g.name);store.href=g.href||'https://store.playstation.com/ar-sa/search/'+encodeURIComponent(g.name)}
function closeModal(){modal.classList.remove('show')}
q.addEventListener('keydown',e=>{if(e.key==='Enter')applySearch()});type.addEventListener('change',applySearch);load();
</script></body></html>
