<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PS4 IRAQ — مكتبة ألعاب PS4</title>
<style>
:root{--bg:#070b14;--card:#0e1524;--card2:#111b2d;--line:#263650;--text:#f4f7fb;--muted:#9eabc1;--blue:#3d8bfd;--blue2:#67a7ff;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#142849 0,#070b14 42%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}
a{color:inherit}.wrap{max-width:1250px;margin:auto;padding:18px}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:16px;justify-content:space-between;max-width:1250px;margin:auto;padding:16px 18px}.brand{font-weight:900;font-size:28px}.brand b{color:var(--blue)}
.hero{padding:42px 0 20px}.hero h1{font-size:clamp(34px,6vw,68px);margin:0 0 12px}.hero p{color:var(--muted);font-size:18px;line-height:1.8;max-width:900px}
.search{display:flex;gap:10px;margin:22px 0}.search input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;color:white;font-size:17px;outline:none}.btn{border:0;border-radius:14px;padding:13px 20px;background:var(--blue);color:white;font-weight:800;cursor:pointer}.btn.secondary{background:var(--card);border:1px solid var(--line)}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.filters select{background:var(--card);border:1px solid var(--line);border-radius:13px;color:white;padding:13px;min-width:0}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.pill{padding:10px 14px;border:1px solid var(--line);background:var(--card);border-radius:999px;color:#c9d4e7}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}.game{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:17px;overflow:hidden;cursor:pointer;transition:.18s;min-width:0}.game:hover{transform:translateY(-3px);border-color:#3c5a86}.cover{aspect-ratio:2/3;background:#0a0f19;display:block;width:100%;object-fit:cover}.gamebody{padding:12px}.title{font-weight:850;line-height:1.4;min-height:48px}.ar{color:var(--muted);font-size:13px;margin-top:4px;min-height:20px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{font-size:11px;border:1px solid #2b3c59;color:#b9c7dc;border-radius:999px;padding:5px 7px}.empty{text-align:center;color:var(--muted);padding:60px}.loading{text-align:center;color:var(--muted);padding:30px}.pager{display:flex;justify-content:center;gap:8px;margin:26px 0;flex-wrap:wrap}.pager button{background:var(--card);color:white;border:1px solid var(--line);padding:10px 14px;border-radius:10px;cursor:pointer}.pager button.active{background:var(--blue);border-color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:50;display:none;overflow:auto;padding:24px}.modal.open{display:block}.detail{max-width:1050px;margin:30px auto;background:#0a111e;border:1px solid var(--line);border-radius:22px;overflow:hidden}.detailTop{display:grid;grid-template-columns:280px 1fr;gap:25px;padding:24px}.detailCover{width:100%;border-radius:16px;aspect-ratio:2/3;object-fit:cover;background:#0d1523}.close{float:left;background:var(--card);border:1px solid var(--line);color:white;border-radius:10px;padding:9px 13px;cursor:pointer}.detail h2{font-size:34px;margin:8px 0}.detail p{color:#c2ccdc;line-height:1.9}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.fact{background:var(--card);border:1px solid var(--line);padding:12px;border-radius:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.note{padding:12px 14px;border:1px dashed #334765;color:#aab8ce;border-radius:13px;margin-top:15px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.detailTop{grid-template-columns:1fr}.detailCover{max-width:280px;margin:auto}.search{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">PS4 <b>IRAQ</b></div><button class="btn secondary" onclick="resetAll()">الرئيسية</button></div></header>
<main class="wrap">
<section class="hero"><h1>مكتبة PS4 الحقيقية</h1><p>نسخة موسعة مصممة لعرض أكثر من ألف لعبة حقيقية، مع بحث سريع، تصنيفات، أنماط لعب، أغلفة، معلومات عمرية، روابط المتجر والتريلرات وصفحات تفاصيل عربية.</p>
<div class="search"><input id="q" placeholder="ابحث باسم اللعبة... GTA V، God of War، FIFA"><button class="btn" onclick="apply()">بحث</button></div>
<div class="filters">
<select id="genre" onchange="apply()"><option value="">كل الأنواع</option></select>
<select id="mode" onchange="apply()"><option value="">كل الأنماط</option><option>فردي</option><option>فردي + أونلاين</option><option>فردي + جماعي</option></select>
<select id="letter" onchange="apply()"><option value="">كل الحروف</option></select>
<select id="sort" onchange="apply()"><option value="name">الاسم</option><option value="popular">المميزة أولاً</option></select>
</div>
<div class="stats"><span class="pill" id="count">جارٍ التحميل...</span><span class="pill">صفحات تفاصيل</span><span class="pill">أغلفة حقيقية عند توفرها</span><span class="pill">تريلر لكل لعبة عبر يوتيوب</span></div>
</section>
<section id="games"><div class="loading">جارٍ تحميل مكتبة الألعاب...</div></section>
<div class="pager" id="pager"></div>
</main>
<div class="modal" id="modal"><div class="detail" id="detail"></div></div>
<script src="games.js"></script>
<script>
const remoteBase='https://raw.githubusercontent.com/Ephellon/game-store-catalog/main/ps4/';
const letters=['_','a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];
let all=[], filtered=[], page=1, per=40;
const popular=['Grand Theft Auto V','Red Dead Redemption 2','God of War','Marvel\\'s Spider-Man','The Last of Us Part II','Horizon Zero Dawn','Horizon Forbidden West','Ghost of Tsushima','Bloodborne','Uncharted 4: A Thief\\'s End','Elden Ring','Cyberpunk 2077','The Witcher 3: Wild Hunt','Resident Evil 2','Resident Evil 4','God of War Ragnarök','Call of Duty: Modern Warfare','FIFA 23','EA Sports FC 24','Minecraft','Rocket League','Fortnite','It Takes Two','A Way Out','Persona 5 Royal','Final Fantasy VII Remake','Monster Hunter: World','Sekiro: Shadows Die Twice','Dark Souls III','Death Stranding','Days Gone','Control'];
function arName(n){return window.AR_NAMES[n]||n}
function guessGenre(n){let x=n.toLowerCase();if(/fifa|fc |nba|madden|mlb|wwe|pes|ufc|motogp|f1 |wrc|ride|dirt|need for speed|gran turismo|project cars|assetto|crew|burnout|snowrunner|mudrunner|wreckfest/.test(x))return 'رياضة / سباقات';if(/dark souls|elden ring|bloodborne|nioh|sekiro|lies of p|lords of the fallen|surge|mortal shell|wo long|thymesia/.test(x))return 'أكشن RPG / سولز';if(/call of duty|battlefield|doom|wolfenstein|titanfall|rainbow six|destiny|division|far cry|ghost recon|sniper|metro|borderlands|prey|rage|apex|overwatch|warframe/.test(x))return 'تصويب / أكشن';if(/assassin|watch dogs|uncharted|tomb raider|god of war|spider-man|horizon|ghost of tsushima|last of us|red dead|gta|witcher|cyberpunk|days gone|death stranding|detroit|batman|mad max/.test(x))return 'أكشن ومغامرات';if(/final fantasy|persona|dragon quest|tales |atelier|disgaea|yakuza|star ocean|trails|digimon|sword art|nier|dragon ball/.test(x))return 'RPG / تقمص أدوار';if(/resident evil|outlast|amnesia|alien: isolation|little nightmares|dark pictures|evil within|layers of fear|until dawn|quarry|dead by daylight|phasmophobia/.test(x))return 'رعب';if(/overcooked|it takes two|a way out|gang beasts|human fall flat|jackbox|worms|fall guys|rocket league/.test(x))return 'تعاوني / جماعي';if(/minecraft|terraria|stardew|cities|planet coaster|jurassic|farming|powerwash|house flipper|astroneer|subnautica|no man's sky/.test(x))return 'محاكاة / بقاء';if(/street fighter|tekken|mortal kombat|injustice|dragon ball fighter|soulcalibur|guilty gear|blazblue|king of fighters|dead or alive/.test(x))return 'قتال';if(/cuphead|hades|hollow knight|dead cells|celeste|shovel knight|limbo|inside|rayman|crash|spyro|sonic|mega man|blasphemous|axiom verge/.test(x))return 'منصات / إندي';return 'أكشن ومغامرات'}
function guessMode(n){let x=n.toLowerCase();if(/fifa|fc |nba|madden|mlb|wwe|pes|ufc|rocket league|fortnite|apex|overwatch|call of duty|battlefield|rainbow six|destiny|warframe|fall guys|dead by daylight|tekken|street fighter|mortal kombat/.test(x))return 'فردي + أونلاين';if(/overcooked|it takes two|a way out|gang beasts|human fall flat|jackbox|worms/.test(x))return 'فردي + جماعي';return 'فردي'}
function normalize(x){return {name:x.name||x, image:x.image||'', href:x.href||'', rating:x.rating||'غير محدد', genre:x.genre||guessGenre(x.name||x), modes:x.modes||guessMode(x.name||x), uuid:x.uuid||''}}
async function load(){let seen=new Set();window.FALLBACK_GAMES.forEach(g=>{let k=g.name.toLowerCase();if(!seen.has(k)){seen.add(k);all.push(normalize(g))}});render();
try{let chunks=await Promise.all(letters.map(l=>fetch(remoteBase+encodeURIComponent(l)+'.json').then(r=>r.ok?r.json():[]).catch(()=>[])));let remote=[];chunks.forEach(c=>{if(Array.isArray(c))remote.push(...c);else if(c&&typeof c==='object')remote.push(...Object.values(c))});remote.forEach(g=>{let x=normalize(g),k=x.name.toLowerCase();if(!seen.has(k)&&x.name){seen.add(k);all.push(x)}});render()}catch(e){}}
function render(){populate();apply()}
function populate(){let gs=[...new Set(all.map(x=>x.genre))].sort();let sel=document.getElementById('genre');let old=sel.value;sel.innerHTML='<option value="">كل الأنواع</option>'+gs.map(x=>`<option>${esc(x)}</option>`).join('');sel.value=old;let le=document.getElementById('letter');le.innerHTML='<option value="">كل الحروف</option>'+[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(x=>`<option>${x}</option>`).join('')}
function apply(){let q=document.getElementById('q').value.trim().toLowerCase(),g=document.getElementById('genre').value,m=document.getElementById('mode').value,l=document.getElementById('letter').value;filtered=all.filter(x=>(!q||x.name.toLowerCase().includes(q)||arName(x.name).toLowerCase().includes(q))&&(!g||x.genre===g)&&(!m||x.modes===m)&&(!l||x.name[0].toUpperCase()===l));if(document.getElementById('sort').value==='popular')filtered.sort((a,b)=>(popular.includes(b.name)?1:0)-(popular.includes(a.name)?1:0));else filtered.sort((a,b)=>a.name.localeCompare(b.name));page=1;draw()}
function draw(){document.getElementById('count').textContent=`${filtered.length.toLocaleString('ar-EG')} لعبة`;let start=(page-1)*per,items=filtered.slice(start,start+per);document.getElementById('games').innerHTML=items.length?`<div class="grid">${items.map(card).join('')}</div>`:'<div class="empty">لا توجد نتائج بهذا البحث.</div>';let pages=Math.ceil(filtered.length/per);document.getElementById('pager').innerHTML=pages>1?Array.from({length:Math.min(pages,12)},(_,i)=>`<button class="${i+1===page?'active':''}" onclick="go(${i+1})">${i+1}</button>`).join('')+(pages>12?`<span class="pill">… ${pages}</span>`:''):''}
function go(p){page=p;draw();scrollTo({top:300,behavior:'smooth'})}
function card(x){let img=x.image||`https://dummyimage.com/600x900/101827/ffffff&text=${encodeURIComponent(x.name)}`;return `<article class="game" onclick='openGame(${JSON.stringify(x).replace(/'/g,"&#39;")})'><img class="cover" loading="lazy" src="${esc(img)}" onerror="this.src='https://dummyimage.com/600x900/101827/ffffff&text=PS4'"><div class="gamebody"><div class="title">${esc(x.name)}</div><div class="ar">${esc(arName(x.name))}</div><div class="meta"><span class="tag">${esc(x.genre)}</span><span class="tag">${esc(x.modes)}</span></div></div></article>`}
function openGame(x){let img=x.image||`https://dummyimage.com/600x900/101827/ffffff&text=${encodeURIComponent(x.name)}`,yt='https://www.youtube.com/results?search_query='+encodeURIComponent(x.name+' PS4 official trailer');let store=x.href||'https://store.playstation.com/search/'+encodeURIComponent(x.name);document.getElementById('detail').innerHTML=`<div style="padding:16px 20px"><button class="close" onclick="closeModal()">إغلاق</button></div><div class="detailTop"><img class="detailCover" src="${esc(img)}" onerror="this.src='https://dummyimage.com/600x900/101827/ffffff&text=PS4'"><div><h2>${esc(arName(x.name))}</h2><div style="color:#9eabc1">${esc(x.name)}</div><p>صفحة معلومات اللعبة على PS4. ستجد هنا نوع اللعبة، نمط اللعب، التصنيف العمري إن كان متاحاً، الغلاف، ورابط التريلر. الاسم الرسمي يبقى كما هو لتسهيل العثور على اللعبة.</p><div class="facts"><div class="fact"><b>النوع</b><br>${esc(x.genre)}</div><div class="fact"><b>نمط اللعب</b><br>${esc(x.modes)}</div><div class="fact"><b>التصنيف العمري</b><br>${esc(x.rating)}</div><div class="fact"><b>المنصة</b><br>PlayStation 4</div></div><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(yt)}">🎬 التريلر</a><a class="btn secondary" target="_blank" rel="noopener" href="${esc(store)}">🛒 صفحة اللعبة</a></div><div class="note">التقييم الرقمي النقدي لا يتم اختلاقه. إذا لم يتوفر رقم موثوق في البيانات، يظهر التصنيف العمري بدلاً منه.</div></div></div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function resetAll(){document.getElementById('q').value='';document.getElementById('genre').value='';document.getElementById('mode').value='';document.getElementById('letter').value='';apply();scrollTo({top:0,behavior:'smooth'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')apply()});load();
</script>
</body></html>
