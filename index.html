<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="مكتبة ألعاب PS4 عربية: ابحث عن ألعاب بلايستيشن 4، شاهد الصور والتقييمات والقصص والتريلرات.">

<meta property="og:title" content="PS4 Iraq — مكتبة ألعاب PS4">

<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#f6f8fb;font-family:Arial,Tahoma,sans-serif}.hero{padding:24px 6% 50px;background:radial-gradient(circle at 80% 0,#25477e,transparent 35%),linear-gradient(135deg,#09101f,#070a10)}nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900;color:#68a8ff}.pill{border:1px solid #344b6c;border-radius:999px;padding:8px 13px;color:#a9b9d2}.heroIn{max-width:1000px;margin:60px auto 0;text-align:center}.hero h1{font-size:clamp(38px,7vw,70px);margin:0 0 12px}.hero p{color:#bdc8d9;line-height:1.9}.search{display:flex;gap:9px;max-width:900px;margin:25px auto}.search input{flex:1;background:#111827;color:white;border:1px solid #33445f;border-radius:14px;padding:17px;font-size:17px}.search button{background:#3985ff;color:#fff;border:0;border-radius:14px;padding:0 24px;font-weight:800}.wrap{max-width:1450px;margin:auto;padding:32px 6%}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar h2{margin:0;font-size:30px}.count{color:#91a0b8}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters select,.filters button{background:#111827;color:#fff;border:1px solid #2d3e59;border-radius:10px;padding:11px}.letters{display:flex;gap:6px;overflow:auto;padding:5px 0 16px}.letters button{background:#111827;color:#b9c5d7;border:1px solid #293a54;border-radius:9px;padding:8px 11px}.letters button.active{background:#3985ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:17px}.card{background:#101620;border:1px solid #1d293a;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#3985ff}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#172238}.info{padding:12px}.title{font-weight:800;line-height:1.4;min-height:43px}.meta{display:flex;justify-content:space-between;color:#8999b2;font-size:12px;margin-top:7px;gap:8px}.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin:32px}.pager button{background:#111827;color:#fff;border:1px solid #2d3e59;padding:10px 16px;border-radius:10px}.pager button:disabled{opacity:.35}.empty{text-align:center;padding:70px;color:#8796ad}.status{text-align:center;color:#8d9db6;padding:20px}.modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.box{width:min(900px,100%);max-height:92vh;overflow:auto;background:#101620;border:1px solid #30415c;border-radius:22px;padding:22px}.close{float:left;background:#273449;color:#fff;border:0;border-radius:9px;padding:9px 13px}.mimg{width:220px;max-height:330px;object-fit:cover;border-radius:14px;float:right;margin-left:22px}.box h2{font-size:30px;margin-top:35px}.box p{line-height:2;color:#c5cfdd}.links{clear:both;display:flex;gap:9px;flex-wrap:wrap;padding-top:18px}.links a{color:#fff;text-decoration:none;background:#e22e50;padding:11px 15px;border-radius:10px;font-weight:bold}.links a.alt{background:#29405f}.links a.store{background:#2f75df}footer{border-top:1px solid #151e2d;text-align:center;color:#65748b;padding:35px}@media(max-width:600px){.heroIn{margin-top:40px}.search button{padding:0 15px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.info{padding:9px}.mimg{float:none;width:150px}}
</style>
</head>
<body>
<section class="hero"><nav><div class="logo">🎮 PS4 IRAQ</div><div class="pill">مجاني • عربي • PS4</div></nav>
<div class="heroIn"><h1>مكتبة ألعاب PS4</h1><p>ابحث عن ألعاب PlayStation 4 واستكشف الصور والتقييمات والتصنيفات والتريلرات.</p>
<div class="search"><input id="q" placeholder="ابحث باسم اللعبة..." autocomplete="off"><button onclick="apply()">بحث</button></div></div></section>
<main class="wrap"><div class="bar"><h2>🎮 الألعاب</h2><span class="count" id="count">جاري التحميل...</span></div>
<div class="filters"><select id="year"><option value="">كل السنوات</option></select><select id="genre"><option value="">كل الأنواع</option></select><button onclick="resetAll()">إعادة ضبط</button></div>
<div class="letters" id="letters"></div><div class="status" id="status">جاري تحميل كتالوج الألعاب...</div><div class="grid" id="grid"></div><div class="pager" id="pager"></div></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="box"><button class="close" onclick="closeModal()">إغلاق</button><img id="mimg" class="mimg"><h2 id="mtitle"></h2><p id="mmeta"></p><p id="mdesc">جاري جلب المعلومات...</p><div class="links"><a id="yt" target="_blank">▶ التريلر</a><a id="wiki" class="alt" target="_blank">📖 Wikipedia</a><a id="store" class="store" target="_blank">🛒 المتجر</a></div></div></div>
<footer>PS4 Iraq © 2026 — مكتبة ألعاب PlayStation 4</footer>
<script>
const BASE='https://raw.githubusercontent.com/Ephellon/game-store-catalog/main/ps4/';
const files=['!','a','b','c','d','e','f','g','h','i','j','k','l','m','n','o','p','q','r','s','t','u','v','w','x','y','z'];
let all=[],filtered=[],page=1,perPage=72,letter='',infoCache={};
const ph=t=>'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900"><rect width="100%" height="100%" fill="#172238"/><text x="50%" y="45%" fill="#e9f0ff" font-size="32" text-anchor="middle" font-family="Arial">${String(t).slice(0,26)}</text><text x="50%" y="53%" fill="#7890b5" font-size="21" text-anchor="middle" font-family="Arial">PS4</text></svg>`);
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){let rs=await Promise.all(files.map(async f=>{try{let r=await fetch(BASE+f+'.json');return r.ok?await r.json():[]}catch(e){return[]}}));let m=new Map();rs.flat().forEach(g=>{if(g&&g.name)m.set(g.name.toLowerCase(),g)});all=[...m.values()].sort((a,b)=>a.name.localeCompare(b.name));status.textContent='تم تحميل الكتالوج.';fillFilters();makeLetters();apply()}
function fillFilters(){[...new Set(all.map(g=>g.year).filter(Boolean))].sort((a,b)=>b-a).forEach(y=>year.insertAdjacentHTML('beforeend',`<option>${esc(y)}</option>`));let gs=[...new Set(all.flatMap(g=>String(g.genre||g.genres||'').split(/[,|]/).map(x=>x.trim()).filter(Boolean)))].sort();gs.slice(0,80).forEach(g=>genre.insertAdjacentHTML('beforeend',`<option>${esc(g)}</option>`))}
function makeLetters(){letters.innerHTML='<button class="active" onclick="setLetter(\'\')">الكل</button>'+files.map(x=>`<button onclick="setLetter('${x}')">${x==='!'?'#':x.toUpperCase()}</button>`).join('')}
function setLetter(x){letter=x;document.querySelectorAll('.letters button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('.letters button')[files.indexOf(x)+1]?.classList.add('active');apply()}
function apply(){let q=document.getElementById('q').value.trim().toLowerCase(),y=year.value,g=genre.value;filtered=all.filter(x=>{let n=String(x.name||'').toLowerCase(),genres=String(x.genre||x.genres||'');return(!q||n.includes(q))&&(!y||String(x.year)===y)&&(!g||genres.toLowerCase().includes(g.toLowerCase()))&&(!letter||(letter==='!'?!/^[a-z]/i.test(n):n.startsWith(letter)))});page=1;render()}
function render(){count.textContent=all.length.toLocaleString()+' لعبة';let s=(page-1)*perPage,l=filtered.slice(s,s+perPage);grid.innerHTML=l.length?l.map((g,i)=>`<article class="card" onclick="openGame(${s+i})"><img class="poster" src="${esc(g.image||ph(g.name))}" onerror="this.src='${ph(g.name)}'" loading="lazy"><div class="info"><div class="title">${esc(g.name)}</div><div class="meta"><span>${esc(g.year||'PS4')}</span><span>${esc(g.rating||'')}</span></div></div></article>`).join(''):'<div class="empty">لا توجد نتائج.</div>';let n=Math.ceil(filtered.length/perPage);pager.innerHTML=n>1?`<button ${page===1?'disabled':''} onclick="go(${page-1})">السابق</button><span>صفحة ${page} من ${n}</span><button ${page===n?'disabled':''} onclick="go(${page+1})">التالي</button>`:''}
function go(n){page=n;render();scrollTo({top:520,behavior:'smooth'})}
function resetAll(){q.value='';year.value='';genre.value='';letter='';makeLetters();apply()}
async function wiki(title){if(infoCache[title])return infoCache[title];try{let u='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(title+' PS4')+'&gsrnamespace=0&gsrlimit=1&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=500&exintro=1&explaintext=1&format=json&origin=*';let j=await(await fetch(u)).json(),p=j.query&&j.query.pages?Object.values(j.query.pages)[0]:null,d={extract:p?.extract||'',image:p?.thumbnail?.source||''};infoCache[title]=d;return d}catch(e){return {}}}
async function openGame(i){let g=filtered[i],d=await wiki(g.name);modal.classList.add('show');mtitle.textContent=g.name;mmeta.textContent='🎮 PS4  |  '+(g.year||'')+'  |  '+(g.rating||'');mdesc.textContent=d.extract||'لا يوجد وصف متاح حالياً.';mimg.src=g.image||d.image||ph(g.name);yt.href='https://www.youtube.com/results?search_query='+encodeURIComponent(g.name+' PS4 trailer');wiki.href='https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(g.name);store.href=g.href||'https://store.playstation.com/search/'+encodeURIComponent(g.name)}
function closeModal(){modal.classList.remove('show')}
q.addEventListener('keydown',e=>{if(e.key==='Enter')apply()});load();
</script></body></html>
